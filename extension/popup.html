<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>악뮤 예매 도우미</title></head><body>
<h1>악뮤 예매 도우미</h1><p class="hint">실제 예스24 자동 예매 연동은 준비 중입니다.</p>
<h2>1. 좌석 설정</h2><div class="pair"><label>구역<select id="section"></select></label><label>위치<select id="position"><option value="front">앞쪽</option><option value="middle" selected>중간</option><option value="back">뒤쪽</option></select></label><label>수량<input id="count" type="number" min="1" max="4" value="2"></label></div><button id="save-count">좌석 설정 저장</button><details><summary>웹에서 고른 설정 가져오기</summary><label>설정 파일<input id="preferences-file" type="file" accept=".json"></label></details><p id="plan"></p><p id="countdown"></p>
<button id="live-practice" class="secondary">실제 예매 테스트 · 이찬원 / 약뮤 부산</button><h2>2. 예매 준비</h2><div class="pair"><button id="open">예스24 열기</button><button id="prepare">10분 전 자동 열기</button></div><button id="login-done">로그인 완료 · 대기 시작</button><p class="hint">컴퓨터와 Chrome을 켜 두세요. 오픈 후 버튼이 활성화되면 한 번 클릭합니다.</p><div class="pair"><button id="arm" class="secondary">지금 대기 시작</button><button id="disarm" class="secondary">대기 중지</button></div><button id="cancel-prepare" class="secondary">자동 열기 취소</button><p>마지막 결제하기·인증·입금은 직접 진행합니다.</p>
<details><summary>고급 설정</summary><p class="hint">실제 사이트 연결을 위한 개발용 설정입니다.</p><button id="remind">준비 알림 등록</button><label>로그인 완료 표시 CSS · 선택 사항<input id="loggedIn" placeholder="예: 로그인 후에만 보이는 로그아웃 버튼"></label><hr><h2>1. 미리 화면 점검</h2><button id="inspect">현재 화면 점검</button><pre id="report">실제 공연 페이지를 열고 점검하세요.</pre><h2>2. 예매 버튼 준비</h2><button id="pick-booking">화면에서 예매 버튼 직접 지정</button><label>지정한 예매 버튼 CSS<input id="booking" placeholder="버튼 지정 시 자동 입력됩니다"></label><button id="save">버튼·좌석 설정 저장</button><button id="book">지금 한 번 클릭</button><details><summary>3. 연속 좌석 설정</summary><label>좌석 CSS<input id="seat" placeholder="예: button.seat"></label><label>구역 속성<input id="sectionAttr" value="data-section"></label><label>열 속성<input id="rowAttr" value="data-row"></label><label>무대 앞에서부터 열 순서 속성<input id="rowIndexAttr" value="data-row-index"></label><label>구역의 전체 열 수 속성<input id="rowTotalAttr" value="data-row-total"></label><label>번호 속성<input id="numberAttr" value="data-number"></label><label>통로 블록 속성<input id="blockAttr" value="data-block"></label><label>판매 가능 여부 속성<input id="availableAttr" value="data-available"></label><label>선택 완료 상태 속성<input id="selectedAttr" value="data-selected"></label><label>선택 완료를 뜻하는 정확한 값<input id="selectedValue" value="true"></label><label>판매 가능을 뜻하는 정확한 값<input id="availableValue" value="true"></label></details><div class="pair"><button id="preview">좌석 후보 표시</button><button id="select">확인한 후보 클릭</button></div><button id="stop" class="secondary">좌석 후보 지우기</button><details><summary>예스24 진행 순서 · 고급 설정</summary><label><input id="useYes24Sequence" type="checkbox"> 제공한 예스24 예매 순서 적용</label><label>검증한 예스24 단계별 선택자 JSON<textarea id="yes24Mapping" rows="8" placeholder="실제 사이트에서 확인한 단계별 CSS 선택자"></textarea></label><label>시작 버튼 다음에 실행할 단계<textarea id="flow" rows="5" placeholder="#회차선택다음버튼&#10;WAIT #사람확인화면&#10;SEATS&#10;#좌석선택완료&#10;WAIT #결제화면&#10;#예매내역보기"></textarea></label><label>사람 확인·결제 진행 중 화면 CSS<input id="manualGate" placeholder="보이는 동안 모든 자동 클릭을 멈춥니다"></label><label><input id="adjacent" type="checkbox"> 우선 구역이 없으면 배치 좌표상 인접 구역 탐색</label><label>좌석 배치 X 좌표 속성<input id="xAttr" value="data-seat-x"></label><label>좌석 배치 Y 좌표 속성<input id="yAttr" value="data-seat-y"></label></details><h2>4. 다음 단계</h2><button id="pick-next">화면에서 다음 단계 버튼 지정</button><label>다음 단계 CSS<input id="next"></label><button id="next-step">확인 후 다음 단계 클릭</button></details><p id="status" role="status"></p><script src="plan.js"></script><script src="yes24-sequence.js"></script><script src="preset.js"></script><script type="module" src="popup.js"></script></body></html>
