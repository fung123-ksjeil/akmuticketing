<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>악뮤 고양 킨텍스 예매 도우미</title><link rel="stylesheet" href="style.css"></head><body>
<main class="dashboard akmu-dashboard">
 <header><h1>악뮤 · 고양 킨텍스</h1><nav aria-label="도움말"><a href="demo.html">연습</a><a href="https://github.com/fung123-ksjeil/akmuticketing/archive/refs/heads/main.zip">확장 다운로드</a><a href="https://github.com/fung123-ksjeil/akmuticketing#readme">사용법</a></nav></header>
 <div class="event-line"><span>공연 <b>2027. 1. 2. (토) 17:00</b></span><span>예매 오픈 <b>2026. 11. 10. (화) 20:00</b></span></div>
 <div class="grid booking-grid">
  <section class="card map-card"><h2>구역 선택</h2><svg id="seat-map" aria-label="악뮤 고양 킨텍스 구역 배치도"></svg><div class="map-legend"><span class="vip">STANDING·VIP</span><span class="r">R</span><span class="limited">시야제한</span><span class="chosen">선택 구역</span></div><p class="map-note">제공하신 배치도 기준 · 실시간 잔여 좌석 아님</p></section>
  <section class="card preference-card"><form id="settings">
   <label>희망 구역<select name="section" id="section"></select></label>
   <fieldset><legend>구역 내 위치</legend><div class="position-options"><label><input type="radio" name="position" value="front">앞쪽</label><label><input type="radio" name="position" value="middle" checked>중간</label><label><input type="radio" name="position" value="back">뒤쪽</label></div></fieldset>
   <label>예매 수량 · 최대 4매<select name="count"><option value="1">1매</option><option value="2" selected>2매</option><option value="3">3매</option><option value="4">4매</option></select></label>
   <p id="selection-summary" class="selection-summary"></p><p class="seat-note">같은 열의 붙어 있는 좌석 우선</p>
   <button type="submit" class="full">설정 저장</button><button type="button" id="export" class="secondary full">확장에 전달할 설정 받기 ↓</button><p id="saved" role="status"></p>
  </form><div class="opening"><span>예매 시작까지 · 한국시간</span><p id="countdown" class="clock"></p><button id="open-page" class="full">예스24 예매 페이지 열기 ↗</button></div></section>
 </div><footer>자동 클릭은 Chrome 확장에서 실행 · 실제 예스24 연동은 준비 중 · 인증·결제는 직접 진행</footer>
</main><script src="extension/plan.js"></script><script src="extension/preset.js"></script><script src="seating-map.js"></script><script src="app.js"></script></body></html>
